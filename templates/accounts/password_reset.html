<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-slate-950 p-8 rounded-2xl border border-slate-800 shadow-2xl">
        <h2 class="text-xl font-bold mb-2">စကားဝှက် ပြန်လည်သတ်မှတ်ရန်</h2>
        <p class="text-sm text-slate-400 mb-5">သင့်အကောင့်ဖွင့်ခဲ့သော အီးမေးလ်ကို ရိုက်ထည့်ပေးပါ။ စကားဝှက်ပြောင်းရန် လင့်ခ်ကို ပို့ပေးပါမည်။</p>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-sm text-slate-400 block mb-1">အီးမေးလ်လိပ်စာ (Email)</label>
                <input type="email" name="email" required class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 w-full focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition">ဂြီမေးလ်ပို့မည်</button>
        </form>
    </div>
</body>
</html>
